[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-detection"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "flask==3.1.2",
    "gunicorn==23.0.0",
    "joblib==1.5.2",
    "numpy==2.2.6",
    "scikit-learn==1.7.1",
]

[dependency-groups]
dev = [
    "black==25.1.0",
    "flake8==7.3.0",
    "pytest==8.4.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.packages.find]
include = ["anomaly_detection*"]

[tool.black]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
