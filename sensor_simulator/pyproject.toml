[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensor-simulator"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "black==25.1.0",
    "flake8==7.3.0",
    "pytest==8.4.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.packages.find]
include = ["sensor_simulator*"]

[tool.black]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
